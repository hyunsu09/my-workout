<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이쁜이 & 듬직이 지하 헬스장 운동 일지</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-100 selection:text-blue-900">

  <div class="max-w-[480px] mx-auto min-h-screen bg-slate-50 shadow-xl border-x border-slate-200/80 pb-14">
    
    <!-- 상단 고정 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
      <!-- 사용자 전환 바 (이쁜이 / 듬직이) -->
      <div class="bg-slate-100/90 px-4 py-2 border-b border-slate-200/80 flex items-center justify-between gap-2">
        <span class="text-[11px] font-extrabold text-slate-500 shrink-0">👤 사용자 선택</span>
        <div class="grid grid-cols-2 gap-2 flex-1 max-w-[220px]">
          <button onclick="switchUser('pretty')" id="user-btn-pretty" class="py-1.5 rounded-lg text-xs font-extrabold bg-rose-500 text-white shadow-xs transition">
            이쁜이
          </button>
          <button onclick="switchUser('reliable')" id="user-btn-reliable" class="py-1.5 rounded-lg text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
            듬직이
          </button>
        </div>
      </div>

      <div class="px-4 pt-3 pb-2.5">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="flex items-center gap-1.5 mb-1">
              <span id="sync-badge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 border border-slate-200">
                ⚪ 깃허브 미연동 (로컬 모드)
              </span>
            </div>
            <h1 id="routine-title" class="text-lg font-extrabold tracking-tight text-slate-900 leading-snug">
              주 2회 지하 헬스장 전신 루틴
            </h1>
            <p id="routine-subtitle" class="text-[11px] font-medium text-slate-500 mt-0.5">
              기구 그림을 보고 순서대로 따라 하세요 · 약 45~50분
            </p>
          </div>
          <button 
            onclick="openResetModal()" 
            class="shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 border border-slate-200 transition">
            체크 초기화
          </button>
        </div>

        <!-- 네비게이션 탭 -->
        <nav class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-xl mt-3">
          <button onclick="switchTab('workout')" id="tab-workout" class="tab-btn py-1.5 rounded-lg text-xs font-extrabold bg-white text-blue-700 shadow-xs transition">
            🏋️ 오늘 운동
          </button>
          <button onclick="switchTab('history')" id="tab-history" class
