  if (res.status === 404) throw new Error(`${FILES[user]} 파일이 아직 없습니다. 기록을 저장하면 생성됩니다.`);
  if (!res.ok) throw new Error(await readGhError(res));
  const body = await res.json();
  let parsed;
  try { parsed = JSON.parse(fromB64(body.content || "")); }
  catch (e) { throw new Error("깃허브 파일이 운동 기록 JSON이 아닙니다."); }
  data = normalize(parsed);
  blocked = false;
  saveLocal(false);
  lastError = "";
  note = "깃허브 기록을 불러왔습니다.";
  noteBad = false;
  toast("깃허브 기록을 불러왔습니다.");
}
async function manualPush() {
  const cfg = cfgFromForm(true);
  if (!cfg.token) throw new Error("Fine-grained PAT를 입력해 주세요.");
  saveLocal(false);
  pushQueued = false;
  clearTimeout(pushTimer);
  setSyncFor(user, "깃허브 저장 중…", false);
  await sendGithub(user, localStorage.getItem(FILES[user]));
  lastError = "";
  note = `${FILES[user]}에 저장했습니다.`;
  noteBad = false;
  setSyncFor(user, "깃허브에 저장됨", false);
  toast("깃허브에 저장했습니다.");
}
function withNet(task) {
  if (netBusy) return;
  netBusy = true;
  note = "깃허브와 통신 중…";
  noteBad = false;
  renderView();
  Promise.resolve()
    .then(task)
    .catch((err) => {
      note = err.message;
      noteBad = true;
      lastError = err.message;
      setSyncFor(user, "깃허브 오류", true);
    })
    .finally(() => {
      netBusy = false;
      renderView();
    });
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function armAudio() {
  const ctx = ensureAudio();
  if (!ctx || keeper) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.00001;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  keeper = osc;
}
function disarmAudio() {
  if (!keeper) return;
  try { keeper.stop(); } catch (e) { /* already stopped */ }
  keeper = null;
}
function beep() {
  const ctx = ensureAudio();
  if (!ctx) return;
  ctx.resume().then(() => {
    [880, 880, 1175].forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.28;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.24);
    });
  }).catch(() => {});
}
function fmt(ms) {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
}
function paintTimer(ms) {
  const clock = document.getElementById("clock");
  const label = document.getElementById("timerLabel");
  const box = document.getElementById("timer");
  if (!clock) return;
  clock.textContent = fmt(timer.running ? ms : 0);
  clock.classList.toggle("run", timer.running);
  if (label) label.textContent = timer.label;
  if (box && timer.running) box.classList.remove("done");
}
function startTimer(seconds, label) {
  armAudio();
  timer.endsAt = Date.now() + seconds * 1000;
  timer.running = true;
  timer.label = label;
  clearInterval(timer.tick);
  timer.tick = setInterval(() => {
    const left = timer.endsAt - Date.now();
    if (left <= 0) stopTimer(true);
    else paintTimer(left);
  }, 200);
  paintTimer(seconds * 1000);
}
function stopTimer(finished) {
  clearInterval(timer.tick);
  timer.tick = 0;
  timer.running = false;
  timer.endsAt = 0;
  if (finished) {
    timer.label = "휴식 끝";
    beep();
    if (navigator.vibrate) navigator.vibrate([90, 50, 90, 50, 180]);
    const box = document.getElementById("timer");
    if (box) {
      box.classList.add("done");
      setTimeout(() => box && box.classList.remove("done"), 1600);
    }
    setTimeout(disarmAudio, 1200);
  } else {
    timer.label = "정지됨";
    disarmAudio();
  }
  paintTimer(0);
}

function head(x, y, dx, dy) {
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const bx = x - ux * 11;
  const by = y - uy * 11;
  return `<polygon points="${x},${y} ${bx + -uy * 6},${by + ux * 6} ${bx - -uy * 6},${by - ux * 6}" fill="${ARROW}"/>`;
}
function arrow(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const bx = x2 - (dx / len) * 11;
  const by = y2 - (dy / len) * 11;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${ARROW}" stroke-width="3" stroke-linecap="round"/>${head(x2, y2, dx, dy)}`;
}

    idsForDay(day).forEach((id) => {
      const rec = day.exercises[id];
      if (!meaningful(rec)) return;
      const ex = list.find((item) => item.id === id);
      const done = Array.isArray(rec.done) ? rec.done : [];
      const bits = [];
      if (String(rec.weight || "").trim()) bits.push(`${rec.weight}kg`);
      if (done.length) bits.push(`${done.filter(Boolean).length}/${done.length}세트`);
      if (ex && ex.reps) bits.push(ex.reps);
      lines.push(`- ${ex ? ex.name : id}: ${bits.join(" · ")}`);
    });
  });
  return `${lines.join("\n").trim()}\n`;
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
}
function toast(message) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}
function defaultSync() {
  return readCfg().token ? "변경하면 깃허브에 자동 저장" : "이 기기에만 저장 중";
}
function setSyncFor(which, text, bad) {
  syncMsg[which] = { text, bad: !!bad };
  if (which === user) paintSync();
}
function paintSync() {
  const el = document.getElementById("sync");
  if (!el) return;
  const msg = syncMsg[user] || { text: defaultSync(), bad: false };
  el.textContent = msg.text;
  el.classList.toggle("bad", !!msg.bad);
}
function renderChrome() {
  document.querySelectorAll("[data-user]").forEach((btn) => {
    btn.setAttribute("aria-checked", String(btn.dataset.user === user));

  });

  if (date) date.textContent = headerDate();
  if (file) file.textContent = FILES[user];

}
function banner() {
  let html = "";
  if (blocked) {
    html += `<div class="banner bad"><p>이 사용자의 저장 기록을 읽지 못했습니다. 덮어쓰지 않도록 자동 저장을 멈춰 두었습니다.</p><div class="row"><button type="button" data-action="discard-corrupt">새로 기록 시작</button></div></div>`;
  }
  if (pending) {
    html += `<div class="banner"><p>${esc(pending.message)}</p><div class="row"><button type="button" data-action="confirm-yes">확인</button><button type="button" class="ghost" data-action="confirm-no">취소</button></div></div>`;
  }
  return html;
}
function exerciseCard(ex, index, markNext) {
  const rec = viewRec(ex);
  const allDone = rec.done.every(Boolean);
  const tags = [`<span class="tag">${esc(ex.subtitle)}</span>`];
  if (allDone) tags.push(`<span class="tag ok">완료</span>`);
  else if (markNext) tags.push(`<span class="tag next">다음</span>`);
  const buttons = rec.done.map((on, i) => {
    const caption = ex.sets === 1 ? "완료" : String(i + 1);
    return `<button type="button" class="${on ? "on" : ""}" data-action="toggle-set" data-ex="${esc(ex.id)}" data-set="${i}" aria-pressed="${on}" aria-label="${esc(ex.name)} ${caption}">${caption}</button>`;
  }).join("");
  const weight = ex.weight ? `<label class="field">무게 (kg)<input data-ex="${esc(ex.id)}" inputmode="decimal" autocomplete="off" placeholder="${esc(ex.guide ? ex.guide.split(" · ")[0] : "예: 15")}" value="${esc(rec.weight)}" /></label>` : "";
  return `<article class="ex${allDone ? " done" : ""}">
    ${illustration(ex.art, ALT[ex.art] || ALT.generic)}
    <div class="body">
      <div class="title-row"><h2><span class="idx">${index}</span>${esc(ex.name)}</h2><div class="tags">${ex.subtitle ? tags.join("") : tags.slice(1).join("")}</div></div>
      <p class="meta">${esc(prescription(ex))}${ex.guide ? ` · ${esc(ex.guide)}` : ""}</p>
      <p class="point"><strong>포인트</strong> · ${esc(ex.tip)}</p>
      ${ex.youtubeUrl ? `<a class="yt-btn" href="${esc(ex.youtubeUrl)}" target="_blank" rel="noopener noreferrer">📺 자세 영상 보기</a>` : ""}
      <p class="prev">${esc(prevText(ex))}</p>
      ${weight}
      <div class="sets">
        <div class="sets-label"><span>세트</span>${ex.rest ? `<span>체크하면 ${ex.rest}초</span>` : "<span>휴식 없음</span>"}</div>
        <div class="set-row">${buttons}</div>
      </div>
    </div>
  </article>`;
}
function guidanceCard() {
  const g = GUIDANCE[user] || GUIDANCE.pretty;
  const rows = g.items.map(([k, v]) => {
    const body = esc(v).replace(/\n/g, "<br>");
    return `<li><strong>${esc(k)}:</strong> ${v.includes("\n") ? "<br>" : ""}${body}</li>`;
  }).join("");
  return `<section class="guide-card"><h3>${esc(g.title)}</h3><ul>${rows}</ul></section>`;
}
function renderToday() {
  const prog = todayProgress();
  let marked = false;
  const cards = activeRoutine().map((ex, i) => {
    const done = viewRec(ex).done.every(Boolean);
    const mark = !marked && !done;
    if (mark) marked = true;
    return exerciseCard(ex, i, mark);
  }).join("");
  return `${banner()}<section class="summary"><div class="row"><strong>오늘 ${prog.done}/${prog.total}세트</strong><span>${prog.pct}%</span></div><p class="meta" style="margin-top:4px">${esc(PROFILES[user] || PROFILES.pretty)}</p><div class="progress" aria-hidden="true"><div style="width:${prog.pct}%"></div></div></section>${guidanceCard()}${cards}`;
}
function renderJournal() {
  const days = data.days.slice().filter((day) => Object.values(day.exercises).some(meaningful)).sort((a, b) => b.date.localeCompare(a.date));
  const cards = days.map((day) => {
    const items = idsForDay(day).map((id) => {
      const rec = day.exercises[id];
      if (!meaningful(rec)) return "";
      const ex = activeRoutine().find((item) => item.id === id);
      const done = Array.isArray(rec.done) ? rec.done : [];
      const bits = [];
      if (String(rec.weight || "").trim()) bits.push(`${rec.weight}kg`);
      if (done.length) bits.push(`${done.filter(Boolean).length}/${done.length}세트`);
      return `<li><strong>${esc(ex ? ex.name : id)}</strong> · ${esc(bits.join(" · "))}</li>`;
    }).join("");
    return `<article class="day"><h3>${esc(formatDate(day.date))}</h3><ul>${items}</ul></article>`;
  }).join("");
  const empty = `<div class="empty"><p>아직 기록이 없습니다.</p><p>오늘 운동에서 세트를 누르면 이곳에 쌓입니다.</p></div>`;
  return `${banner()}<section class="panel"><h2>운동 일지</h2><p class="lead">${esc(NAMES[user])} · ${days.length}일 · <span class="filechip">${esc(FILES[user])}</span></p><div class="actions"><button type="button" class="wide" data-action="copy-log">AI 전달용 기록 복사</button></div></section>${cards || empty}`;
}
function renderRoutine() {
  const example = `{
  "id": "squat",
  "name": "스쿼트",
  "subtitle": "하체",
  "sets": 3,
  "reps": "10회",
  "rest": 60,
  "weight": true,
  "tip": "무릎을 발끝 방향으로",

}`;
  return `${banner()}<section class="panel"><h2>루틴 교체</h2><p class="lead">배열 JSON으로 이 사용자의 루틴만 바꿉니다. id가 같으면 지난 무게·세트 기록과 이어집니다. 그림 키: treadmill, legpress, legcurl, legext, latpull, chest, reardelt, backext, roller, generic.</p>
    <label class="field">새 루틴 JSON<textarea id="routineInput" spellcheck="false">${esc(routineDraft)}</textarea></label>
    <p id="routineError" class="note bad">${esc(routineError)}</p>
    <div class="actions">
      <button type="button" data-action="apply-routine">이 코드로 교체</button>
      <button type="button" class="ghost" data-action="reset-routine">기본 루틴으로 복원</button>
      <button type="button" class="ghost" data-action="fill-routine">기본 루틴 채우기</button>
      <button type="button" class="ghost" data-action="copy-routine">현재 루틴 복사</button>
    </div>
    <details class="help"><summary>항목 예시</summary><pre>${esc(example)}</pre></details>

}
function renderGithub() {
  const cfg = readCfg();
  return `${banner()}<section class="panel"><h2>깃허브 설정</h2><p class="lead">Fine-grained PAT에 이 저장소의 Contents 읽기·쓰기 권한이 필요합니다. 토큰은 이 브라우저에만 저장되고 운동 JSON에는 들어가지 않습니다. 사람마다 파일이 분리되고, 저장 파일에는 날짜별 기록이 누적됩니다.</p>
    <p class="lead">지금 사용자 <strong>${esc(NAMES[user])}</strong></p>
    <span class="filechip">${esc(FILES[user])}</span>
    <label class="field">GitHub 아이디<input id="ghOwner" autocomplete="off" value="${esc(cfg.owner)}" /></label>
    <label class="field">저장소 이름<input id="ghRepo" autocomplete="off" value="${esc(cfg.repo)}" /></label>
    <label class="field">Fine-grained Personal Access Token<input id="ghToken" type="password" autocomplete="off" spellcheck="false" placeholder="${cfg.token ? "저장됨 · 바꾸려면 새로 입력" : "github_pat_..."}" /></label>
    <div class="actions">
      <button type="button" data-action="save-github" ${netBusy ? "disabled" : ""}>설정 저장</button>
      <button type="button" class="ghost" data-action="clear-token">토큰 삭제</button>
      <button type="button" data-action="pull-github" ${netBusy ? "disabled" : ""}>깃허브에서 불러오기</button>
      <button type="button" data-action="push-github" ${netBusy ? "disabled" : ""}>지금 깃허브에 저장</button>
    </div>
    <p class="lead">다른 기기에서 이어서 하려면 먼저 불러오기를 누르세요. 이후 변경은 자동으로 커밋됩니다.</p>
    ${note ? `<p class="note${noteBad ? " bad" : ""}">${esc(note)}</p>` : ""}
    ${lastError && lastError !== note ? `<p class="note bad">${esc(lastError)}</p>` : ""}

function renderView() {
  const view = document.getElementById("view");
  if (!view) return;
  if (tab === "journal") view.innerHTML = renderJournal();
  else if (tab === "routine") view.innerHTML = renderRoutine();
  else if (tab === "github") view.innerHTML = renderGithub();
  else view.innerHTML = renderToday();
}
function mount() {
  document.documentElement.dataset.user = user;
  app.innerHTML = `
    <div class="sticky-wrap">
      <header class="top">
        <p class="eyebrow"><span id="date"></span> · <span id="filename"></span></p>
        <div class="users" role="radiogroup" aria-label="사용자">
          <button type="button" data-user="pretty" role="radio">이쁜이</button>
          <button type="button" data-user="reliable" role="radio">듬직이</button>
        </div>
        <p id="sync" class="sync" aria-live="polite"></p>
      </header>
      <section class="timer" id="timer" aria-label="휴식 타이머">
        <div class="timer-top">
          <div>
            <p class="timer-kicker">휴식 타이머</p>
            <p id="clock">00:00</p>
          </div>
          <div class="timer-actions">
            <button type="button" data-seconds="45">45초</button>
            <button type="button" data-seconds="60">60초</button>
            <button type="button" data-action="stop-timer">정지</button>
          </div>
        </div>

      </section>
    </div>
    <main id="view"></main>
    <nav role="tablist" aria-label="메뉴">
      <button type="button" data-tab="today" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M12 4v16"/></svg><span>오늘 운동</span></button>
      <button type="button" data-tab="journal" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 5h12v14H6zM9 9h6M9 13h6"/></svg><span>운동 일지</span></button>
      <button type="button" data-tab="routine" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg><span>루틴 교체</span></button>
      <button type="button" data-tab="github" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 7c6 0 8 4 8 5"/></svg><span>깃허브 설정</span></button>
    </nav>
    <div id="toast" role="status"></div>`;
  renderChrome();
  renderView();
  paintTimer(0);
}

function setUser(next) {
  if (next !== "pretty" && next !== "reliable") return;
  if (next === user) return;
  flushPush();
  user = next;
  localStorage.setItem(ACTIVE_KEY, user);
  document.documentElement.dataset.user = user;
  pending = null;
  note = "";
  loadData();
  if (!syncMsg[user]) setSyncFor(user, defaultSync(), false);
  renderChrome();
  renderView();
}
function toggleSet(id, index) {
  if (blocked) return;
  const ex = activeRoutine().find((item) => item.id === id);
  if (!ex || index < 0 || index >= ex.sets) return;
  const day = ensureToday();
  const rec = ensureRec(day, ex);
  const turningOn = !rec.done[index];
  rec.done[index] = turningOn;
  saveLocal();
  if (turningOn && ex.rest > 0) startTimer(ex.rest, `${ex.name} · ${ex.rest}초`);
  if (turningOn && navigator.vibrate) navigator.vibrate(12);
  renderView();
}
function onWeight(id, input) {
  if (blocked) return;
  const ex = activeRoutine().find((item) => item.id === id);
  if (!ex) return;
  const cleaned = cleanWeight(input.value);
  if (input.value !== cleaned) input.value = cleaned;
  const rec = ensureRec(ensureToday(), ex);
  rec.weight = cleaned;
  saveLocal();
}
function confirmYes() {
  const current = pending;
  pending = null;
  if (!current) return;
  if (current.type === "routine") {
    data.routine = current.routine;
    saveLocal();
    routineError = "";
    toast("루틴을 바꿨습니다.");
    renderView();
  } else if (current.type === "restore") {
    data.routine = null;
    saveLocal();
    toast("기본 루틴으로 되돌렸습니다.");
    renderView();
  } else if (current.type === "pull") {
    renderView();
    withNet(pullGithub);
  }
}
function runAction(action, btn) {
  if (action === "stop-timer") return stopTimer(false);
  if (action === "toggle-set") return toggleSet(btn.dataset.ex, Number(btn.dataset.set));
  if (action === "confirm-no") { pending = null; renderView(); return; }
  if (action === "confirm-yes") return confirmYes();
  if (action === "discard-corrupt") {
    blocked = false;
    data = emptyData();
    saveLocal(false);
    toast("새 기록을 시작합니다.");
    renderView();
    return;
  }
  if (action === "copy-log") {
    copyText(buildAiText()).then(() => toast("AI 전달용 기록을 복사했습니다."));
    return;
  }
  if (action === "copy-routine") {
    copyText(JSON.stringify(activeRoutine(), null, 2)).then(() => toast("현재 루틴 JSON을 복사했습니다."));
    return;
  }
  if (action === "fill-routine") {
    routineDraft = JSON.stringify(defaultRoutineFor(user), null, 2);
    routineError = "";
    renderView();
    return;
  }
  if (action === "apply-routine") {
    const text = document.getElementById("routineInput").value;
    routineDraft = text;
    try {
      const next = parseRoutine(text);
      routineError = "";
      pending = { type: "routine", routine: next, message: `${next.length}개 운동으로 바꿀까요?\n${next.map((ex, i) => `${i}. ${ex.name}`).join("\n")}` };
    } catch (err) {
      routineError = err.message;
      pending = null;
    }
    renderView();
    return;
  }
  if (action === "reset-routine") {
    if (!data.routine) { toast("이미 기본 루틴입니다."); return; }
    pending = { type: "restore", message: "기본 루틴으로 되돌릴까요?\n지난 기록은 운동 id가 같으면 그대로 남습니다." };
    renderView();
    return;
  }
  if (action === "save-github") {
    try {
      const cfg = cfgFromForm(true);
      note = cfg.token ? "설정을 저장했습니다. 이후 기록은 자동으로 커밋됩니다." : "아이디와 저장소를 저장했습니다. 토큰을 넣으면 자동 커밋이 켜집니다.";
      noteBad = false;
      toast("깃허브 설정을 저장했습니다.");
      setSyncFor(user, defaultSync(), false);
    } catch (err) {
      note = err.message;
      noteBad = true;
    }
    renderView();
    return;
  }
  if (action === "clear-token") {
    const cfg = readCfg();
    cfg.token = "";
    localStorage.setItem(GH_KEY, JSON.stringify(cfg));
    pushQueued = false;
    note = "이 브라우저에서 토큰을 지웠습니다.";
    noteBad = false;
    setSyncFor(user, defaultSync(), false);
    renderView();
    return;
  }
  if (action === "pull-github") {
    if (data.days.length) {
      pending = { type: "pull", message: `깃허브의 ${FILES[user]}로 이 기기의 ${NAMES[user]} 기록을 바꿀까요?` };
      renderView();
      return;
    }
    withNet(pullGithub);
    return;
  }
  if (action === "push-github") withNet(manualPush);
}
app.addEventListener("click", (event) => {
  const btn = event.target.closest("button");
  if (!btn || !app.contains(btn)) return;
  ensureAudio();
  if (btn.dataset.user) return setUser(btn.dataset.user);
  if (btn.dataset.seconds) return startTimer(Number(btn.dataset.seconds), `${btn.dataset.seconds}초 휴식`);
  if (btn.dataset.tab) {
    tab = btn.dataset.tab;
    pending = null;
    renderChrome();
    renderView();
    return;
  }
  if (btn.dataset.action) runAction(btn.dataset.action, btn);
});
app.addEventListener("input", (event) => {
  const target = event.target;
  if (target.id === "routineInput") {
    routineDraft = target.value;
    routineError = "";
    const err = document.getElementById("routineError");
    if (err) err.textContent = "";
  }
  if (target.dataset.ex) onWeight(target.dataset.ex, target);
});
app.addEventListener("focusin", (event) => {
  if (event.target.matches("input, textarea")) {
    setTimeout(() => event.target.scrollIntoView({ block: "center", behavior: "smooth" }), 180);
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushPush();
});
window.addEventListener("pagehide", flushPush);

loadData();
setSyncFor(user, defaultSync(), false);
mount();
</script>
